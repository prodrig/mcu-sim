# ===========================================================================
# Las tres suites, en las cuatro plataformas, en cada commit.
#
# LO QUE SE COMPRUEBA NO ES QUE PASEN. Eso lo comprueba cualquiera. Lo que se
# comprueba es que el TIEMPO SIMULADO no se mueva, al picosegundo, contra
# src/verif/invariantes.txt. Un cambio que deje las 2118 comprobaciones en
# verde pero mueva el reloj del modelo ha cambiado el comportamiento de algo,
# y eso tiene que teñir el commit de rojo.
#
# Que esto sea posible es reciente: hasta que los firmwares se versionaron,
# cada maquina compilaba los suyos y ejecutaba un programa distinto, asi que
# el tiempo simulado no era comparable entre maquinas (T-22 en doc/todo.md).
# Sin aquello, este fichero no podria existir.
#
# macOS entra aqui por una razon concreta: es la unica plataforma de las tres
# que el proyecto declara soportar y que nadie ha ejecutado nunca. La forma
# legal de probarla desde un PC con Windows es esta -hardware Apple de
# verdad-, no una maquina virtual: la licencia de macOS solo permite
# virtualizarla sobre un ordenador Apple.
# ===========================================================================
name: suites

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un empujon nuevo cancela el anterior de la misma rama: las suites tardan
# minutos y no tiene sentido pagar por resultados que ya no interesan.
concurrency:
  group: suites-${{ github.ref }}
  cancel-in-progress: true

env:
  SYSTEMC_VER: "2.3.4"

jobs:
  # -------------------------------------------------------------------------
  # Lo que no necesita SystemC. Tarda menos de un minuto y caza los errores
  # tontos antes de encender cuatro maquinas.
  # -------------------------------------------------------------------------
  rapidas:
    name: Sin SystemC (red, macros de Windows, vectores)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: El SEGUNDO motor de los vectores de cifrado
        # `verif/vectores/comprueba_vectores.py` devuelve 1 si algun caso queda
        # confirmado por UN SOLO motor, y hace bien: un vector que solo
        # confirma openssl no es una comprobacion independiente, es openssl
        # comparandose consigo mismo. En una maquina recien hecha falta
        # pycryptodome, y los 32 casos de AES, DES y TDES caen a un motor.
        #
        # Esto no es un remiendo para poner el CI en verde: es la dependencia
        # que la comprobacion necesita para valer lo que dice que vale.
        run: python3 -m pip install --break-system-packages pycryptodome

      - name: Capa de red, minas de Windows, vectores de CRYP y HASH
        working-directory: src
        run: make -f Makefile.mcu-sim red hash cryp vectores

  # -------------------------------------------------------------------------
  # Linux con el paquete de la distribucion, que es LA VIA QUE DOCUMENTAMOS en
  # doc/compilacion.md 4. Si algun dia desaparece de Ubuntu, quiero que falle
  # aqui y no en el portatil de un alumno.
  # -------------------------------------------------------------------------
  linux:
    name: Linux (g++, libsystemc-dev)
    runs-on: ubuntu-latest
    needs: rapidas
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SystemC desde el paquete de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemc-dev
          dpkg -l libsystemc-dev | tail -1

      - name: Las tres suites
        working-directory: src
        run: |
          set -o pipefail
          mkdir -p build
          for s in test407 test446 test417; do
            make -f Makefile.mcu-sim $s 2>&1 | tee build/$s.log
          done

      - name: Los tres invariantes, al picosegundo
        run: |
          for s in test407 test446 test417; do
            sh ci/comprueba_invariante.sh $s src/build/$s.log
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salidas-linux
          path: src/build/*.log

  # -------------------------------------------------------------------------
  # macOS, en las dos arquitecturas. La de Apple Silicon es la que usan los
  # alumnos; la Intel esta porque el Makefile tiene una rama para ella
  # (lib-macosx64) y una rama que nadie ejecuta no esta verificada.
  # -------------------------------------------------------------------------
  macos:
    name: macOS ${{ matrix.arq }}
    runs-on: ${{ matrix.os }}
    needs: rapidas
    timeout-minutes: 30
    strategy:
      fail-fast: false            # que una arquitectura no tape a la otra
      matrix:
        os: [macos-26, macos-26-intel]
        include:
          - os: macos-26
            arq: Apple Silicon
          - os: macos-26-intel
            arq: Intel
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # SystemC DE HOMEBREW, no compilada aqui. Es LA VIA QUE DOCUMENTA
      # compilacion.md 4 -«SYSTEMC_HOME se detecta entre /opt/homebrew (Apple
      # Silicon) y /usr/local (Intel)»-, o sea que es lo que hace un alumno.
      # El mismo criterio que en Linux con apt: el CI verifica las
      # instrucciones que damos, no una receta que solo existe aqui.
      #
      # Y arregla de paso el desastre de la ejecucion anterior. Por miedo a
      # QuickThreads puse `ENABLE_PTHREADS` en las dos arquitecturas, y las
      # corrutinas de pthreads cuestan un cambio de contexto del sistema
      # operativo por cada despertar del planificador, que es justo lo que
      # este modelo hace sin parar. MEDIDO en la misma maquina, mismo codigo,
      # mismo firmware: test407 con QuickThreads tarda 20,8 s; con pthreads
      # seguia corriendo a los 41 minutos. macOS Intel no se colgaba: iba dos
      # ordenes de magnitud mas lento y se comia los 45 minutos de limite.
      #
      # OJO CON LA VERSION: Homebrew trae la 3.0.2, no la 2.3.4 de Linux y
      # Windows. Es deliberado y tiene su control: Apple Silicon ya paso con
      # 2.3.4 + pthreads dando los tres invariantes EXACTOS, asi que este
      # cambio es de una sola variable sobre una medida conocida. Si el
      # invariante se mueve, ha sido la version de SystemC. Y entonces NO se
      # toca verif/invariantes.txt: se averigua por que. Vease I-24.
      # ---------------------------------------------------------------------
      - name: SystemC desde Homebrew
        run: |
          brew install systemc
          brew list --versions systemc

      # `make plataforma` es el primer paso que compilacion.md manda dar
      # cuando algo no cuadra. Que lo de el CI vale por dos: comprueba la
      # deteccion automatica de SYSTEMC_HOME y deja en el log que se detecto.
      - name: Que ha detectado el Makefile
        working-directory: src
        run: make -f Makefile.mcu-sim plataforma

      # SIN pasar SYSTEMC_HOME, a proposito: aqui se ejerce la deteccion
      # automatica, que es la que se encuentra un alumno.
      - name: Las tres suites
        working-directory: src
        run: |
          set -o pipefail
          mkdir -p build
          for s in test407 test446 test417; do
            make -f Makefile.mcu-sim $s CXX=clang++ 2>&1 | tee build/$s.log
          done

      - name: Los tres invariantes, al picosegundo
        run: |
          for s in test407 test446 test417; do
            sh ci/comprueba_invariante.sh $s src/build/$s.log
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salidas-macos-${{ matrix.os }}
          path: src/build/*.log

  # -------------------------------------------------------------------------
  # Windows con MSYS2, que es lo que usa el autor y lo que documenta el
  # proyecto. Es la UNICA plataforma en la que SystemC se construye aqui:
  # Linux la tiene en apt y macOS en Homebrew, y en las dos se usa el paquete
  # para que el CI ejerza lo que dice la documentacion. En MSYS2 no hay
  # paquete, y como construirla ahi es justo lo que compilacion.md 3 NO
  # cuenta, esta receta es de momento la unica que existe escrita.
  # -------------------------------------------------------------------------
  windows:
    name: Windows (MSYS2 / MinGW-w64)
    runs-on: windows-latest
    needs: rapidas
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git make
          pacboy: toolchain:p cmake:p ninja:p

      - name: Cache de SystemC
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/systemc
          key: systemc-${{ env.SYSTEMC_VER }}-cxx17-mingw64-qt-v3

      - name: Construir SystemC si no estaba en la cache
        # NI PTHREADS NI FIBER: QuickThreads, como en cualquier Unix, y con el
        # preprocesador encendido para el ensamblador.
        #
        # El CMakeLists de SystemC 2.3.4 solo elige Fiber cuando el compilador
        # es MSVC. Con MinGW detecta `__x86_64__` y se va a QuickThreads, cuyo
        # `iX86_64.s` termina asi:
        #
        #     #if defined(__linux__) && defined(__ELF__)
        #     .section .note.GNU-stack,"",%progbits
        #     #endif
        #
        # Un fichero `.s` en minuscula NO pasa por el preprocesador, asi que el
        # `#if` se trata como un comentario y la directiva se ensambla siempre.
        # En COFF eso no vale y `as` corta con «junk at end of line, first
        # unrecognized character is `-'», que es el guion de `GNU-stack`.
        #
        # `-x assembler-with-cpp` enciende el preprocesador: `__linux__` no
        # esta definido, la seccion no se emite y el objeto sale. Reproducido y
        # comprobado en las dos direcciones con el MinGW cruzado de Debian
        # antes de escribir esto, no deducido del log.
        run: |
          sh ci/construye_systemc.sh "$(cygpath -u "$GITHUB_WORKSPACE")/systemc" \
              -G Ninja -DCMAKE_ASM_FLAGS="-x assembler-with-cpp"

      - name: Las tres suites
        working-directory: src
        run: |
          set -o pipefail
          mkdir -p build
          for s in test407 test446 test417; do
            make -f Makefile.mcu-sim $s \
                 SYSTEMC_HOME="$(cygpath -u "$GITHUB_WORKSPACE")/systemc" \
                 2>&1 | tee build/$s.log
          done

      - name: Los tres invariantes, al picosegundo
        run: |
          for s in test407 test446 test417; do
            sh ci/comprueba_invariante.sh $s src/build/$s.log
          done

      - name: Que el .exe no dependa de ninguna DLL de MinGW
        # El `-static` del Makefile no es un lujo: sin el, el ejecutable
        # funciona dentro del shell de MSYS2 y desde `cmd` se queja de
        # `clock_gettime64`. Esta contado en doc/compilacion.md 5.6, y una
        # comprobacion que nadie ejecuta no protege de nada.
        working-directory: src
        run: |
          make -f Makefile.mcu-sim mcu-sim \
               SYSTEMC_HOME="$(cygpath -u "$GITHUB_WORKSPACE")/systemc"
          objdump -p build/mcu-sim.exe | grep 'DLL Name'
          if objdump -p build/mcu-sim.exe |
             grep -Ei 'DLL Name:.*(libwinpthread|libstdc\+\+|libgcc)'; then
            echo "  [FALLO] el ejecutable arrastra DLL de MinGW"
            exit 1
          fi
          echo "  [OK  ] ninguna DLL de MinGW en las dependencias"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salidas-windows
          path: src/build/*.log
