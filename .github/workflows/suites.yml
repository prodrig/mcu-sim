# ===========================================================================
# Las tres suites, en las cuatro plataformas, en cada commit.
#
# LO QUE SE COMPRUEBA NO ES QUE PASEN. Eso lo comprueba cualquiera. Lo que se
# comprueba es que el TIEMPO SIMULADO no se mueva, al picosegundo, contra
# src/verif/invariantes.txt. Un cambio que deje las 2118 comprobaciones en
# verde pero mueva el reloj del modelo ha cambiado el comportamiento de algo,
# y eso tiene que teñir el commit de rojo.
#
# Que esto sea posible es reciente: hasta que los firmwares se versionaron,
# cada maquina compilaba los suyos y ejecutaba un programa distinto, asi que
# el tiempo simulado no era comparable entre maquinas (T-22 en doc/todo.md).
# Sin aquello, este fichero no podria existir.
#
# macOS entra aqui por una razon concreta: es la unica plataforma de las tres
# que el proyecto declara soportar y que nadie ha ejecutado nunca. La forma
# legal de probarla desde un PC con Windows es esta -hardware Apple de
# verdad-, no una maquina virtual: la licencia de macOS solo permite
# virtualizarla sobre un ordenador Apple.
# ===========================================================================
name: suites

on:
  push:
    branches: [main]
    tags: ['v*']            # una etiqueta publica los ejecutables (job `publica`)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read            # el job `publica` se lo sube a write, y solo el

# POR COMMIT, no por rama. Antes era `github.ref`, y eso hacia que empujar
# `main` y despues la etiqueta `v0.1.0` -el MISMO commit- lanzara la matriz
# entera DOS VECES Y A LA VEZ. Los runners de macOS Intel son el recurso mas
# escaso que usamos, y en la primera etiqueta del proyecto uno de esos dos
# trabajos gemelos se paso de los 30 minutos mientras el otro terminaba en
# tres. No esta demostrado que la causa fuera la contencion -al relanzarlo
# solo, paso-, pero ponerle dos trabajos identicos en paralelo a la maquina
# mas lenta no tiene ninguna ventaja que defender.
#
# Con `github.sha`, la ejecucion de la etiqueta SUSTITUYE a la de la rama: es
# el mismo codigo y ademas publica, o sea que es un superconjunto.
concurrency:
  group: suites-${{ github.sha }}
  cancel-in-progress: true

env:
  SYSTEMC_VER: "2.3.4"

jobs:
  # -------------------------------------------------------------------------
  # Lo que no necesita SystemC. Tarda menos de un minuto y caza los errores
  # tontos antes de encender cuatro maquinas.
  # -------------------------------------------------------------------------
  rapidas:
    name: Sin SystemC (red, macros de Windows, vectores)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: El SEGUNDO motor de los vectores de cifrado
        # `verif/vectores/comprueba_vectores.py` devuelve 1 si algun caso queda
        # confirmado por UN SOLO motor, y hace bien: un vector que solo
        # confirma openssl no es una comprobacion independiente, es openssl
        # comparandose consigo mismo. En una maquina recien hecha falta
        # pycryptodome, y los 32 casos de AES, DES y TDES caen a un motor.
        #
        # Esto no es un remiendo para poner el CI en verde: es la dependencia
        # que la comprobacion necesita para valer lo que dice que vale.
        run: python3 -m pip install --break-system-packages pycryptodome

      - name: La licencia esta puesta, y con nombre
        # Tres cosas que un reparto no puede llevar mal, y las tres pueden
        # fallar de verdad -que es lo minimo que se le pide a una
        # comprobacion-:
        #   1. que exista el fichero LICENSE
        #   2. que sea la AGPLv3 y no un recordatorio de ponerla
        #   3. que el titular del copyright este relleno. La AGPL se hace
        #      valer a traves del copyright: un binario que imprime «PON AQUI
        #      TU NOMBRE» no tiene quien exija nada.
        run: |
          test -f LICENSE || { echo "  [FALLO] falta LICENSE en la raiz"; exit 1; }
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE || {
            echo "  [FALLO] LICENSE no es el texto de la AGPLv3"; exit 1; }
          if grep -q "PON AQUI TU NOMBRE" src/top/sim_main.cpp; then
            echo "  [FALLO] TITULAR_COPYRIGHT sigue sin rellenar"
            exit 1
          fi
          echo "  [OK  ] AGPLv3 con titular"

      - name: Capa de red, minas de Windows, vectores de CRYP y HASH
        working-directory: src
        run: make -f Makefile.mcu-sim red hash cryp vectores serie rfc2217

  # -------------------------------------------------------------------------
  # Linux con el paquete de la distribucion, que es LA VIA QUE DOCUMENTAMOS en
  # doc/compilacion.md 4. Si algun dia desaparece de Ubuntu, quiero que falle
  # aqui y no en el portatil de un alumno.
  # -------------------------------------------------------------------------
  #
  # EN DOS DISTRIBUCIONES, y no por gusto. `ubuntu-22.04` es el SUELO que el
  # ejecutable de Linux declara soportar (vease `paquete-linux`), y una
  # plataforma soportada que nadie ejecuta no esta verificada: es la leccion de
  # I-23 con macOS. `ubuntu-latest` sigue porque es donde vive un alumno hoy.
  #
  # Y trae un regalo: 22.04 empaqueta SystemC 2.3.3, no la 2.3.4 de 24.04, asi
  # que esto contrasta los invariantes contra una TERCERA version de SystemC
  # sin pagar una maquina mas.
  #
  # MEDIDO ANTES DE ESCRIBIR ESTO, no confiado al primer rojo: se construyo la
  # 2.3.3 aparte y se compilo el modelo con g++-11 -el de 22.04-. Sin un aviso,
  # y las tres suites dan las MISMAS cifras al picosegundo: 2118 con
  # 2240553274213 ps de resto, 204 con 1033367277932 y 165 con 718988288.
  linux:
    name: Linux ${{ matrix.os }} (g++, libsystemc-dev)
    runs-on: ${{ matrix.os }}
    needs: rapidas
    timeout-minutes: 30
    strategy:
      fail-fast: false      # que una distribucion no tape a la otra
      matrix:
        os: [ubuntu-22.04, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: SystemC desde el paquete de Ubuntu
        # python3-serial y socat son para la interoperabilidad del puente UART
        # (el ultimo paso): pySerial de la distribucion, que es la 3.5 en las
        # dos Ubuntu, y socat, que es la receta del 7.4 del analisis.
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemc-dev python3-serial socat
          dpkg -l libsystemc-dev python3-serial socat | tail -3

      - name: Las suites (las tres de siempre y testserie)
        env:
          SUITES_PRESUPUESTO: 600
        run: sh ci/pasa_suites.sh

      - name: Los invariantes de las cuatro, al picosegundo
        run: |
          for s in test407 test446 test417 testserie; do
            sh ci/comprueba_invariante.sh $s src/build/$s.log
          done

      # -----------------------------------------------------------------
      # testserie OTRA VEZ, CON UN LOOPBACK LENTO. En la D5 del puente UART
      # los dos macOS la tumbaron -un fallo y el tiempo simulado desviado 1 y
      # 2 ms- por dos esperas del banco que daban por llegado al otro lado del
      # socket lo que aun estaba en el nucleo. En Linux el loopback es tan
      # rapido que nunca se veia. TESTSERIE_RUIDO hace que el banco sondee el
      # canal solo una vez de cada cuatro y que el terminal lea su socket una
      # de cada cuatro: si alguna espera nueva no se sincroniza bien, falla
      # AQUI, o se mueve la cifra, y no hace falta un Mac para enterarse.
      #
      # Se contrasta contra la MISMA linea de invariantes.txt que la pasada
      # normal: con ruido y sin el, el banco tiene que dar lo mismo. El
      # ejecutable ya lo ha construido pasa_suites.sh.
      # -----------------------------------------------------------------
      - name: testserie con un loopback lento (TESTSERIE_RUIDO), al picosegundo
        working-directory: src
        env:
          TESTSERIE_RUIDO: 1
        run: |
          rc=0
          timeout 600 ./build/testserie > build/testserie_ruido.log 2>&1 || rc=$?
          if [ "$rc" != "0" ]; then
            tail -40 build/testserie_ruido.log
            echo "  [FALLO] testserie con ruido termino con codigo $rc"
            exit 1
          fi
          cd .. && sh ci/comprueba_invariante.sh testserie src/build/testserie_ruido.log

      # -----------------------------------------------------------------
      # EL PUENTE UART CONTRA CLIENTES DE VERDAD (fase D6). El `mcu-sim`
      # ejecutable, con placas/vcp_rfc2217.xml y vcp_demo, contra el cliente
      # rfc2217:// y socket:// de pySerial y contra un pty de socat. Aqui no
      # hay invariante: corre con --tiempo-real, como lo corre el alumno, y lo
      # que se comprueba no depende de la velocidad de la maquina.
      # -----------------------------------------------------------------
      - name: Interoperabilidad del puente UART (pySerial y socat)
        working-directory: src
        run: make -f Makefile.mcu-sim interop

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salidas-linux-${{ matrix.os }}
          path: src/build/*.log

  # -------------------------------------------------------------------------
  # EL EJECUTABLE DE LINUX, y por que se construye en Ubuntu 22.04.
  #
  # Un binario de Linux corre HACIA ADELANTE Y NO HACIA ATRAS. El que se
  # compila en 24.04 pide `GLIBC_2.38` y `GLIBCXX_3.4.32` -medido con
  # `objdump -T`- y en 22.04, que trae glibc 2.35, no arranca. La version de
  # glibc de la maquina que construye es EL SUELO de lo que se puede repartir,
  # asi que se elige a proposito la distribucion mas vieja que queremos
  # soportar, no la mas nueva que hay.
  #
  # Y SystemC va ESTATICA aqui, no la de `apt`, por una razon que no es
  # estetica: 22.04 instala `libsystemc-2.3.3.so` y 24.04
  # `libsystemc-2.3.4.so`. Son SONAME distintos, asi que un ejecutable
  # enlazado contra uno NO ENCUENTRA el otro y repartir el binario de Linux
  # enlazado dinamicamente no funcionaria ni entre dos Ubuntu. Metiendola
  # dentro desaparece el problema; `-static-libgcc -static-libstdc++` quita las
  # otras dos que envejecen, y lo unico que queda fuera es glibc.
  #
  # OJO, ESTO TIENE FECHA: la imagen `ubuntu-22.04` empezo su retirada el 17 de
  # septiembre de 2026 y queda sin soporte el 17 de abril de 2027
  # (actions/runner-images#14254). Ese dia el suelo sube a 24.04 quiera o no;
  # esta anotado en P-13 para que sea una decision y no un descubrimiento.
  # -------------------------------------------------------------------------
  paquete-linux:
    name: Ejecutable de Linux (suelo Ubuntu 22.04)
    runs-on: ubuntu-22.04
    needs: rapidas
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache de SystemC estatica
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/systemc
          key: systemc-${{ env.SYSTEMC_VER }}-cxx17-ubuntu2204-estatica-v1

      - name: Construir SystemC si no estaba en la cache
        run: sh ci/construye_systemc.sh "$GITHUB_WORKSPACE/systemc"

      - name: Construir mcu-sim
        working-directory: src
        run: |
          make -f Makefile.mcu-sim mcu-sim \
               SYSTEMC_HOME="$GITHUB_WORKSPACE/systemc" \
               EXTRA_LD="-static-libgcc -static-libstdc++"

      - name: Que no dependa de nada que envejezca
        # Tres cosas, y las tres pueden fallar de verdad:
        #   1. que SystemC y libstdc++ NO aparezcan en las dependencias
        #   2. que el suelo de glibc no pase de 2.35, la de Ubuntu 22.04
        #   3. que el programa arranque, que es lo que nadie comprueba
        working-directory: src
        run: |
          ldd build/mcu-sim
          if ldd build/mcu-sim | grep -E 'libsystemc|libstdc\+\+'; then
            echo "  [FALLO] el ejecutable arrastra SystemC o libstdc++"
            exit 1
          fi
          suelo=$(objdump -T build/mcu-sim |
                  grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          mayor=$(printf '%s\n2.35\n' "$suelo" | sort -V | tail -1)
          echo "  suelo de glibc: $suelo (limite 2.35)"
          if [ "$mayor" != "2.35" ]; then
            echo "  [FALLO] $suelo es mas alto que el de Ubuntu 22.04"
            exit 1
          fi
          echo "  [OK  ] nada que envejezca fuera del binario"
          ./build/mcu-sim --help > /dev/null
          echo "  [OK  ] el ejecutable arranca"

      - name: Empaquetar
        # `ejemplos/` (P-14, fase D7): las dos placas con el puerto serie del
        # MCU y el firmware `vcp_demo`, para que doc/puente_serie.md se pueda
        # seguir con el paquete y sin el repositorio. Van en los TRES paquetes.
        #
        # `tar`, NO el zip de upload-artifact: el zip PIERDE EL BIT DE
        # EJECUCION y el alumno se encuentra un «Permission denied» que no
        # tiene nada que ver con su maquina.
        #
        # LICENSE y NOTICE de SystemC van dentro porque la biblioteca va dentro
        # del binario: eso es lo que pide la seccion 4 de la Apache-2.0 al
        # distribuir «in Source OR OBJECT form». Los deja ahi
        # ci/construye_systemc.sh.
        run: |
          mkdir -p paquete/ejemplos
          cp src/build/mcu-sim paquete/
          cp README.md TERCEROS.md LICENSE paquete/
          cp src/placas/nucleo_f446re_vcp.xml src/placas/vcp_rfc2217.xml \
             src/verif/fw/vcp_demo/vcp_demo.bin paquete/ejemplos/
          cp "$GITHUB_WORKSPACE/systemc/LICENSE" paquete/LICENSE-SystemC.txt
          cp "$GITHUB_WORKSPACE/systemc/NOTICE"  paquete/NOTICE-SystemC.txt
          tar czf mcu-sim-linux-x86_64.tar.gz -C paquete .
          tar tzvf mcu-sim-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: mcu-sim-linux-x86_64
          path: mcu-sim-linux-x86_64.tar.gz

  # -------------------------------------------------------------------------
  # macOS, en las dos arquitecturas. La de Apple Silicon es la que usan los
  # alumnos; la Intel esta porque el Makefile tiene una rama para ella
  # (lib-macosx64) y una rama que nadie ejecuta no esta verificada.
  # -------------------------------------------------------------------------
  macos:
    name: macOS ${{ matrix.arq }}
    runs-on: ${{ matrix.os }}
    needs: rapidas
    timeout-minutes: 30
    strategy:
      fail-fast: false            # que una arquitectura no tape a la otra
      matrix:
        os: [macos-26, macos-26-intel]
        include:
          - os: macos-26
            arq: Apple Silicon
            etiqueta: arm64
          - os: macos-26-intel
            arq: Intel
            etiqueta: x86_64
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # SystemC DE HOMEBREW, no compilada aqui. Es LA VIA QUE DOCUMENTA
      # compilacion.md 4 -«SYSTEMC_HOME se detecta entre /opt/homebrew (Apple
      # Silicon) y /usr/local (Intel)»-, o sea que es lo que hace un alumno.
      # El mismo criterio que en Linux con apt: el CI verifica las
      # instrucciones que damos, no una receta que solo existe aqui.
      #
      # Y arregla de paso el desastre de la ejecucion anterior. Por miedo a
      # QuickThreads puse `ENABLE_PTHREADS` en las dos arquitecturas, y las
      # corrutinas de pthreads cuestan un cambio de contexto del sistema
      # operativo por cada despertar del planificador, que es justo lo que
      # este modelo hace sin parar. MEDIDO en la misma maquina, mismo codigo,
      # mismo firmware: test407 con QuickThreads tarda 20,8 s; con pthreads
      # seguia corriendo a los 41 minutos. macOS Intel no se colgaba: iba dos
      # ordenes de magnitud mas lento y se comia los 45 minutos de limite.
      #
      # OJO CON LA VERSION: Homebrew trae la 3.0.2, no la 2.3.4 de Linux y
      # Windows. Es deliberado y tiene su control: Apple Silicon ya paso con
      # 2.3.4 + pthreads dando los tres invariantes EXACTOS, asi que este
      # cambio es de una sola variable sobre una medida conocida. Si el
      # invariante se mueve, ha sido la version de SystemC. Y entonces NO se
      # toca verif/invariantes.txt: se averigua por que. Vease I-24.
      # ---------------------------------------------------------------------
      - name: SystemC desde Homebrew
        # `coreutils` no es capricho: macOS NO trae `timeout` ni `stdbuf`
        # -son de GNU- y ci/pasa_suites.sh los necesita para ponerle
        # presupuesto a cada suite y para que el log salga en orden. Llegan
        # como `gtimeout` y `gstdbuf`, que es lo que el script busca.
        #
        # socat y pySerial son para la interoperabilidad del puente UART. El
        # Python de los runners de macOS es de Homebrew, que rechaza `pip
        # install` sin --break-system-packages (PEP 668).
        run: |
          brew install systemc coreutils socat
          brew list --versions systemc coreutils socat
          python3 -m pip install --break-system-packages pyserial ||
            python3 -m pip install --user pyserial
          python3 -c "import serial; print('pySerial', serial.VERSION)"

      # `make plataforma` es el primer paso que compilacion.md manda dar
      # cuando algo no cuadra. Que lo de el CI vale por dos: comprueba la
      # deteccion automatica de SYSTEMC_HOME y deja en el log que se detecto.
      - name: Que ha detectado el Makefile
        working-directory: src
        run: make -f Makefile.mcu-sim plataforma

      # SIN pasar SYSTEMC_HOME, a proposito: aqui se ejerce la deteccion
      # automatica, que es la que se encuentra un alumno.
      - name: Las suites (las tres de siempre y testserie)
        env:
          SUITES_PRESUPUESTO: 600
        run: sh ci/pasa_suites.sh CXX=clang++

      - name: Los invariantes de las cuatro, al picosegundo
        run: |
          for s in test407 test446 test417 testserie; do
            sh ci/comprueba_invariante.sh $s src/build/$s.log
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salidas-macos-${{ matrix.os }}
          path: src/build/*.log

      # -----------------------------------------------------------------
      # EL EJECUTABLE DE macOS SE QUEDA ENLAZADO A LA SystemC DE HOMEBREW,
      # a proposito y por decision tomada.
      #
      # Es la unica plataforma donde el alumno instala la biblioteca el
      # mismo -`brew install systemc`, un comando- y eso tiene dos
      # consecuencias buenas: el paquete pesa poco, y SystemC NO SE
      # REDISTRIBUYE, asi que la seccion 4 de la Apache-2.0 no entra en
      # juego aqui. El alumno la obtiene de Accellera via Homebrew, con su
      # licencia al lado.
      #
      # Lo que se paga: si Homebrew sube de version mayor, el `dylib` que
      # el binario pide deja de estar. Por eso `otool -L` queda impreso en
      # el log: el dia que un alumno vea «Library not loaded», la linea que
      # lo explica esta aqui.
      # -----------------------------------------------------------------
      - name: Construir mcu-sim
        working-directory: src
        run: make -f Makefile.mcu-sim mcu-sim CXX=clang++

      - name: De que depende, y que arranca
        working-directory: src
        run: |
          otool -L build/mcu-sim
          ./build/mcu-sim --help > /dev/null
          echo "  [OK  ] el ejecutable arranca"

      - name: Interoperabilidad del puente UART (pySerial y socat)
        working-directory: src
        run: python3 verif/serie/interop.py

      - name: Empaquetar
        # `tar`, no zip: el zip de upload-artifact PIERDE EL BIT DE
        # EJECUCION. Y el `tar` conserva de paso la ausencia de cuarentena,
        # que es cosa del navegador del alumno y no nuestra: como quitarla
        # esta en doc/ejecutables.md.
        run: |
          mkdir -p paquete/ejemplos
          cp src/build/mcu-sim paquete/
          cp README.md TERCEROS.md LICENSE paquete/
          cp src/placas/nucleo_f446re_vcp.xml src/placas/vcp_rfc2217.xml \
             src/verif/fw/vcp_demo/vcp_demo.bin paquete/ejemplos/
          tar czf mcu-sim-macos-${{ matrix.etiqueta }}.tar.gz -C paquete .
          tar tzvf mcu-sim-macos-${{ matrix.etiqueta }}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: mcu-sim-macos-${{ matrix.etiqueta }}
          path: mcu-sim-macos-${{ matrix.etiqueta }}.tar.gz

  # -------------------------------------------------------------------------
  # Windows con MSYS2, que es lo que usa el autor y lo que documenta el
  # proyecto. Es la UNICA plataforma en la que SystemC se construye aqui:
  # Linux la tiene en apt y macOS en Homebrew, y en las dos se usa el paquete
  # para que el CI ejerza lo que dice la documentacion. En MSYS2 no hay
  # paquete, y como construirla ahi es justo lo que compilacion.md 3 NO
  # cuenta, esta receta es de momento la unica que existe escrita.
  # -------------------------------------------------------------------------
  windows:
    name: Windows (MSYS2 / MinGW-w64)
    runs-on: windows-latest
    needs: rapidas
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git make zip unzip
          pacboy: toolchain:p cmake:p ninja:p

      - name: Cache de SystemC
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/systemc
          key: systemc-${{ env.SYSTEMC_VER }}-cxx17-mingw64-qt-v3

      - name: Construir SystemC si no estaba en la cache
        # NI PTHREADS NI FIBER: QuickThreads, como en cualquier Unix, y con el
        # preprocesador encendido para el ensamblador.
        #
        # El CMakeLists de SystemC 2.3.4 solo elige Fiber cuando el compilador
        # es MSVC. Con MinGW detecta `__x86_64__` y se va a QuickThreads, cuyo
        # `iX86_64.s` termina asi:
        #
        #     #if defined(__linux__) && defined(__ELF__)
        #     .section .note.GNU-stack,"",%progbits
        #     #endif
        #
        # Un fichero `.s` en minuscula NO pasa por el preprocesador, asi que el
        # `#if` se trata como un comentario y la directiva se ensambla siempre.
        # En COFF eso no vale y `as` corta con «junk at end of line, first
        # unrecognized character is `-'», que es el guion de `GNU-stack`.
        #
        # `-x assembler-with-cpp` enciende el preprocesador: `__linux__` no
        # esta definido, la seccion no se emite y el objeto sale. Reproducido y
        # comprobado en las dos direcciones con el MinGW cruzado de Debian
        # antes de escribir esto, no deducido del log.
        run: |
          sh ci/construye_systemc.sh "$(cygpath -u "$GITHUB_WORKSPACE")/systemc" \
              -G Ninja -DCMAKE_ASM_FLAGS="-x assembler-with-cpp"

      - name: Las suites (las tres de siempre y testserie)
        env:
          SUITES_PRESUPUESTO: 900      # aqui SystemC se compila antes: mas margen
        run: |
          sh ci/pasa_suites.sh \
             SYSTEMC_HOME="$(cygpath -u "$GITHUB_WORKSPACE")/systemc"

      - name: Los invariantes de las cuatro, al picosegundo
        run: |
          for s in test407 test446 test417 testserie; do
            sh ci/comprueba_invariante.sh $s src/build/$s.log
          done

      - name: Que el .exe no dependa de ninguna DLL de MinGW
        # El `-static` del Makefile no es un lujo: sin el, el ejecutable
        # funciona dentro del shell de MSYS2 y desde `cmd` se queja de
        # `clock_gettime64`. Esta contado en doc/compilacion.md 5.6, y una
        # comprobacion que nadie ejecuta no protege de nada.
        working-directory: src
        run: |
          make -f Makefile.mcu-sim mcu-sim \
               SYSTEMC_HOME="$(cygpath -u "$GITHUB_WORKSPACE")/systemc"
          objdump -p build/mcu-sim.exe | grep 'DLL Name'
          if objdump -p build/mcu-sim.exe |
             grep -Ei 'DLL Name:.*(libwinpthread|libstdc\+\+|libgcc)'; then
            echo "  [FALLO] el ejecutable arrastra DLL de MinGW"
            exit 1
          fi
          echo "  [OK  ] ninguna DLL de MinGW en las dependencias"

      # Con el Python DEL RUNNER, no el de MSYS2: el alumno de Windows ejecuta
      # el .exe desde cmd o PowerShell, no desde un shell de MSYS2, y el .exe
      # es autonomo (el paso de arriba lo acaba de comprobar). Sin socat, que
      # en Windows no hace un COM: eso es com0com, y va a la matriz manual.
      - name: Interoperabilidad del puente UART (pySerial)
        shell: pwsh
        working-directory: src
        run: |
          python -m pip install pyserial
          python verif/serie/interop.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salidas-windows
          path: src/build/*.log

      # El `.exe` ya esta construido por el paso de arriba, que lo hacia para
      # comprobar las DLL. Aqui solo se comprueba que arranca y se empaqueta.
      #
      # Windows es la UNICA plataforma donde el ejecutable es autonomo de
      # verdad: `-static` mete SystemC, libstdc++, libgcc y winpthread dentro.
      # Por eso LICENSE y NOTICE de SystemC van en el paquete —la biblioteca
      # se redistribuye— y por eso no hace falta instalar nada.
      - name: Que arranca, y empaquetar
        run: |
          ./src/build/mcu-sim.exe --help > /dev/null
          echo "  [OK  ] el ejecutable arranca"
          mkdir -p paquete/ejemplos
          cp src/build/mcu-sim.exe paquete/
          cp README.md TERCEROS.md LICENSE paquete/
          cp src/placas/nucleo_f446re_vcp.xml src/placas/vcp_rfc2217.xml \
             src/verif/fw/vcp_demo/vcp_demo.bin paquete/ejemplos/
          cp "$(cygpath -u "$GITHUB_WORKSPACE")/systemc/LICENSE" paquete/LICENSE-SystemC.txt
          cp "$(cygpath -u "$GITHUB_WORKSPACE")/systemc/NOTICE"  paquete/NOTICE-SystemC.txt
          cd paquete && zip -r ../mcu-sim-windows-x86_64.zip . && cd ..
          unzip -l mcu-sim-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mcu-sim-windows-x86_64
          path: mcu-sim-windows-x86_64.zip

  # -------------------------------------------------------------------------
  # PUBLICAR. Solo cuando se empuja una etiqueta `v*`, y solo si TODO lo
  # anterior esta en verde: `needs` es lo que impide repartir un ejecutable que
  # no pasa las suites o que mueve el invariante.
  #
  # `gh release create` con el GITHUB_TOKEN del propio trabajo, sin acciones de
  # terceros: son cuatro lineas y una dependencia menos a la que confiarle un
  # permiso de escritura sobre el repositorio.
  # -------------------------------------------------------------------------
  publica:
    name: Publicar los ejecutables de una etiqueta
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [paquete-linux, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write         # solo aqui, y solo para crear la Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: mcu-sim-*
          path: paquetes
          merge-multiple: true

      - name: Que estan los cuatro
        run: |
          ls -la paquetes
          for f in mcu-sim-linux-x86_64.tar.gz \
                   mcu-sim-macos-arm64.tar.gz \
                   mcu-sim-macos-x86_64.tar.gz \
                   mcu-sim-windows-x86_64.zip; do
            [ -f "paquetes/$f" ] || { echo "  [FALLO] falta $f"; exit 1; }
          done
          echo "  [OK  ] los cuatro paquetes"
          (cd paquetes && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
             --title "mcu-sim $GITHUB_REF_NAME" \
             --notes-file doc/notas_release.md \
             paquetes/*
