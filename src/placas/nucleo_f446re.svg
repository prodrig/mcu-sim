<?xml version="1.0" encoding="UTF-8"?>
<!--
  NUCLEO-F446RE, dibujada a mano: una aproximacion, no una foto ni una
  ilustracion del fabricante. Es el dibujo de placas/nucleo_f446re.xml, que lo
  encuentra solo porque se llama como ella (doc/parts.md, "El dibujo").

  Perfil de autor (mcu-sim-gui, doc/analisis-uso-ilustraciones.md §11): SVG
  1.2 Tiny, geometria como atributo, tamano en milimetros -la placa mide
  70 x 82,5 mm: 500 x 620 unidades, a 0,14 mm la unidad- y cada pieza viva con
  el id de su pieza en el XML: LD2, B1, el RESET B2 y los conectores CN5,
  CN6, CN8 y CN9. Lo demas -los LED PWR y COM, los conectores morpho- es
  decorado: la placa no los declara.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="84mm" height="98mm">
  <defs>
    <style>
      .board-base { fill: #f0f4f8; stroke: #2c3e50; stroke-width: 4; }
      .header-outer { fill: #1a252f; stroke: #2c3e50; stroke-width: 2; }
      .mcu-body { fill: #2c3e50; stroke: #1a252f; stroke-width: 2; }
      .usb-port { fill: #95a5a6; stroke: #7f8c8d; stroke-width: 2; }
      .btn-base { fill: #bdc3c7; stroke: #7f8c8d; stroke-width: 2; }
      .btn-blue { fill: #2980b9; stroke: #1f618d; stroke-width: 2; }
      .btn-black { fill: #34495e; stroke: #2c3e50; stroke-width: 2; }
      .led-green { fill: #2ecc71; stroke: #27ae60; stroke-width: 1.5; }
      .led-red { fill: #e74c3c; stroke: #c0392b; stroke-width: 1.5; }
      .text-label { font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; text-anchor: middle; }
      .text-sub { font-family: 'Arial', sans-serif; font-size: 10px; fill: #7f8c8d; text-anchor: middle; }
      .logo { fill: #002060; font-family: 'Arial', sans-serif; font-size: 28px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <!-- La placa -->
  <rect x="50" y="40" width="500" height="620" rx="15" class="board-base" />

  <!-- Agujeros de montaje -->
  <circle cx="80" cy="70" r="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2" />
  <circle cx="520" cy="70" r="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2" />
  <circle cx="80" cy="630" r="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2" />
  <circle cx="360" cy="630" r="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2" />

  <!-- El USB del ST-LINK -->
  <rect x="250" y="20" width="100" height="45" rx="5" class="usb-port" />

  <!-- Conectores morpho (exteriores): decorado -->
  <rect x="65" y="220" width="30" height="370" class="header-outer" />
  <rect x="505" y="220" width="30" height="370" class="header-outer" />

  <!-- Conectores Arduino (interiores): CN6 y CN8 a la izquierda, CN5 y CN9 a la derecha -->
  <rect id="CN6" x="120" y="300" width="25" height="150" class="header-outer" />
  <rect id="CN8" x="120" y="470" width="25" height="120" class="header-outer" />
  <rect id="CN5" x="455" y="220" width="25" height="160" class="header-outer" />
  <rect id="CN9" x="455" y="400" width="25" height="190" class="header-outer" />

  <!-- El MCU del ST-LINK: decorado -->
  <g>
    <rect x="225" y="90" width="50" height="50" class="mcu-body" rx="2" />
    <text x="250" y="118" font-family="Arial" font-size="8" fill="#ffffff" text-anchor="middle">ST-LINK</text>
  </g>

  <!-- El STM32F446RE -->
  <g>
    <rect x="235" y="390" width="90" height="90" fill="none" stroke="#95a5a6" stroke-width="6" stroke-dasharray="4 4" />
    <rect x="242" y="397" width="76" height="76" class="mcu-body" rx="3" />
    <circle cx="252" cy="463" r="3" fill="#7f8c8d" />
    <text x="280" y="435" font-family="Arial" font-size="10" fill="#ffffff" text-anchor="middle">STM32F446</text>
    <text x="280" y="450" font-family="Arial" font-size="9" fill="#bdc3c7" text-anchor="middle">RET6</text>
  </g>

  <!-- Botones USER (azul, B1) y RESET (negro, B2) -->
  <g id="B1">
    <rect x="180" y="195" width="45" height="45" rx="4" class="btn-base" />
    <circle cx="202" cy="217" r="16" class="btn-blue" />
    <text x="202" y="255" class="text-sub">USER</text>
  </g>
  <g id="B2">
    <rect x="310" y="195" width="45" height="45" rx="4" class="btn-base" />
    <circle cx="332" cy="217" r="16" class="btn-black" />
    <text x="332" y="255" class="text-sub">RESET</text>
  </g>

  <!-- LEDs -->
  <circle cx="420" cy="75" r="6" class="led-red" />
  <text x="420" y="62" class="text-sub">PWR</text>
  <circle cx="455" cy="75" r="6" class="led-green" />
  <text x="455" y="62" class="text-sub">COM</text>
  <circle id="LD2" cx="390" cy="220" r="6" class="led-green" />
  <text x="390" y="208" class="text-sub">LD2 (PA5)</text>

  <!-- Serigrafia -->
  <text x="300" y="540" class="logo">ST</text>
  <text x="300" y="565" class="text-label">NUCLEO-F446RE</text>

  <!-- La linea que separa el ST-LINK -->
  <line x1="50" y1="170" x2="550" y2="170" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="6 4" />
</svg>
