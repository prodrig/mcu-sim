  0,1 mm: 140 x 76 mm- y cada pieza con el id de su pieza en el XML:

    ARRIBA, EL EJE: el BLDC (MOTOR), el acople de fuelle (AC), el husillo de
      bolas 1605 (HX) y el carro (CX), DIBUJADO EN LA POSICION 0 y que va a la
