       [UM1472 §6.3]: LD3 naranja arriba, LD4 verde a la izquierda, LD5 rojo
       a la derecha y LD6 azul abajo -->
  <rect x="305" y="600" width="50" height="50" rx="3" fill="#34495e"/>
  <text x="330" y="630" font-family="sans-serif" font-size="9" fill="#bdc3c7" text-anchor="middle">MEMS</text>
  <circle id="LD3" cx="330" cy="570" r="11" fill="#f39c12" stroke="#d35400" stroke-width="2"/>
  <text x="330" y="548" font-family="sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle">LD3</text>
  <circle id="LD4" cx="270" cy="625" r="11" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="240" y="630" font-family="sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle">LD4</text>
  <circle id="LD5" cx="390" cy="625" r="11" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="420" y="630" font-family="sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle">LD5</text>
  <circle id="LD6" cx="330" cy="680" r="11" fill="#3498db" stroke="#2471a3" stroke-width="2"/>
  <text x="330" y="712" font-family="sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle">LD6</text>
  <!-- Los pulsadores: USER azul (B1, en PA0) y RESET negro (B2, en NRST) -->
  <g id="B1">
    <rect x="130" y="760" width="60" height="60" rx="5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="2"/>
    <circle cx="160" cy="790" r="21" fill="#2980b9" stroke="#1f618d" stroke-width="2"/>
  </g>
  <text x="160" y="842" font-family="sans-serif" font-size="14" fill="#7f8c8d" text-anchor="middle">USER</text>
  <g id="B2">
    <rect x="470" y="760" width="60" height="60" rx="5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="2"/>
    <circle cx="500" cy="790" r="21" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  </g>
  <text x="500" y="842" font-family="sans-serif" font-size="14" fill="#7f8c8d" text-anchor="middle">RESET</text>
  <!-- El micro-USB OTG, abajo, y el nombre -->
  <rect x="295" y="925" width="70" height="45" rx="5" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
  <text x="330" y="880" font-family="sans-serif" font-size="20" font-weight="bold" fill="#002060" text-anchor="middle">STM32F4DISCOVERY</text>
</svg>
