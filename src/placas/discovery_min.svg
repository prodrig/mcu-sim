<?xml version="1.0" encoding="UTF-8"?>
<!--
  STM32F4DISCOVERY (MB997), dibujada a mano: una aproximacion, no una foto ni
  una ilustracion del fabricante. Es el dibujo de placas/discovery_min.xml, que
  lo encuentra solo porque se llama como ella (doc/parts.md §2.6).

  Perfil de autor (mcu-sim-gui, doc/analisis-uso-ilustraciones.md §11): SVG
  1.2 Tiny, geometria como atributo, tamano en milimetros -la placa mide
  66 x 97 mm: 660 x 970 unidades, a 0,1 mm la unidad- y cada pieza viva con el
  id de su pieza en el XML: los cuatro LED de usuario LD3..LD6, los pulsadores
  B1 (USER, azul) y B2 (RESET, negro) y los cristales X2 y X3 -este, el zocalo
  vacio, porque la placa lo trae desoldado-. Lo demas -el ST-LINK, sus LED COM
  y PWR, los conectores P1 y P2, el acelerometro, los USB- es decorado: la
  placa no lo declara.
-->
