<!--
  MSP-EXP430FR2433, dibujada a mano: una aproximacion, no una foto ni una
  ilustracion del fabricante. Es el dibujo de placas/msp_exp430fr2433.xml. La
  disposicion, la de SLAU739 (figura 3 y el esquema): el eZ-FET y su USB
  arriba, el bloque de aislamiento J101, el FR2433 en medio con las dos tiras
  BoosterPack de 20 pines (J1 a la izquierda, J2 a la derecha), los LED con
  sus puentes J10 y J11, y los pulsadores abajo. Q1 (32 kHz) no esta
  conectado de fabrica (R4/R5).

  Perfil de autor (mcu-sim-gui, doc/analisis-uso-ilustraciones.md §11): SVG
  1.2 Tiny, una unidad es 0,1 mm. Cada pieza viva con el id de su pieza en
  el XML (LED1, LED2, S1, S2, S3, USB, BCL, J101, J1, J2, J10, J11, cada pin
  con su id).
-->
