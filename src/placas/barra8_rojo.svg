<?xml version="1.0" encoding="UTF-8"?>
<!--
  BARRA DE 8 LEDS ROJOS con su conector de 9 pines, dibujada a mano: una
  aproximacion, no una foto. Es el dibujo de placas/barra8_anodo_comun_rojo.xml
  y de placas/barra8_catodo_comun_rojo.xml, que lo nombran con ilustracion=:
  las dos barras rojos son iguales por fuera, y lo que cambia -que patilla
  es la comun- no se ve.

  Perfil de autor (mcu-sim-gui, doc/analisis-uso-ilustraciones.md §11): SVG
  1.2 Tiny, geometria como atributo, tamano en milimetros -22,86 x 14,13 mm,
  nueve pines a 2,54 mm: una unidad es 0,1 mm- y cada pieza viva con el id de
  su pieza en el XML: los LEDs D1 a D8 y el conector P1, con cada pin dibujado
  por su nombre (P1.COM, P1.D1 a P1.D8) para que los hilos de un sistema
  lleguen a su pin. Bajo cada pin, su nombre en una etiqueta, como en los
  pinouts de las placas: COM, el primero por la izquierda, y D1 a D8. Las
  resistencias de 2 kohm son decorado: en la placa van dentro de cada LED (r).
-->
