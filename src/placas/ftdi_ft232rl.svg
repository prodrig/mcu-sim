<?xml version="1.0" encoding="UTF-8"?>
<!--
  ADAPTADOR USB-SERIE CON FT232RL, dibujado a mano: una aproximacion, no una
  foto. Es el dibujo de placas/ftdi_ft232rl.xml, que lo encuentra solo porque
  se llama como ella.

  Perfil de autor (mcu-sim-gui, doc/analisis-uso-ilustraciones.md §11): SVG
  1.2 Tiny, geometria como atributo, tamano en milimetros -una unidad es
  0,1 mm: la placa mide 36 x 18 mm, y a la izquierda asoman los pines
  acodados- y cada pieza con el id de su pieza en el XML: el conector P1, con
  cada pin por su nombre (P1.DTR ... P1.GND); el jumper JP1, con los suyos
  (JP1.5V, JP1.VCC, JP1.3.3V); el FT232RL, U1; y el USB, USB_5V, que es de
  donde salen los 5 V.

  EL PUENTE DEL JUMPER esta dibujado en sus dos posiciones, como VARIANTES
  de JP1: `JP1@5V-VCC` y `JP1@VCC-3.3V`. mcu-sim deja solo la que dice el
  puente= de la placa antes de mandar el dibujo a la ventana
  (src/common/svg_variantes.h); con puente="no" no queda ninguna.
-->
