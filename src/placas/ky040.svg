    </g>
    <g id="P1.DT">
      <rect x="0" y="71.6" width="43.0" height="6" fill="#c0c0c0" stroke="#7f7f7f" stroke-width="0.8"/>
      <rect x="51.0" y="69.6" width="10" height="10" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="0.8"/>
    </g>
    <g id="P1.SW">
      <rect x="0" y="97.0" width="43.0" height="6" fill="#c0c0c0" stroke="#7f7f7f" stroke-width="0.8"/>
      <rect x="51.0" y="95.0" width="10" height="10" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="0.8"/>
    </g>
    <g id="P1.VCC">
