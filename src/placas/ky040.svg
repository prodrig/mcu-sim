      <rect x="51.0" y="120.4" width="10" height="10" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="0.8"/>
    </g>
    <g id="P1.GND">
      <rect x="0" y="147.8" width="43.0" height="6" fill="#c0c0c0" stroke="#7f7f7f" stroke-width="0.8"/>
      <rect x="51.0" y="145.8" width="10" height="10" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="0.8"/>
