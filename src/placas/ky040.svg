<?xml version="1.0" encoding="UTF-8"?>
<!--
  MODULO KY-040, ENCODER ROTATIVO CON PULSADOR, dibujado a mano: una
  aproximacion, no una foto. Es el dibujo de placas/ky040.xml, que lo
  encuentra solo porque se llama como ella.

  Perfil de autor (mcu-sim-gui, doc/analisis-uso-ilustraciones.md §11): SVG
  1.2 Tiny, geometria como atributo, tamano en milimetros -una unidad es
  0,1 mm: la placa mide 30 x 20 mm, y a la izquierda asoman los pines
  acodados- y cada pieza con el id de su pieza en el XML: el conector P1, con
  cada pin por su nombre (P1.CLK ... P1.GND) -cada uno, su patilla acodada y
  su cuadrado: un hilo engancha en la punta de la patilla-; las resistencias
  R2 y R3; y EL MANDO del centro, que son dos piezas, una encima de otra:

    ENC   el anillo moleteado, con su marca. Gira con el encoder (el efecto
          `giro` de la tabla de enlaces): la marca apunta arriba en la
          posicion 0, y avanza 12 grados por clic, a la derecha. Es un
          circulo centrado en el eje, con todo dentro: el centro de su caja es
          el eje, y gira sobre el.
    SW1   la tapa del centro: el pulsador, que se hunde al apretarlo.

  La rueda del raton sobre el mando gira el encoder; un clic en la tapa lo
  aprieta.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 335 200" width="33.5mm" height="20mm">
  <rect x="30" y="1" width="300" height="198" rx="6" fill="#0d2350" stroke="#06122b" stroke-width="2"/>
  <g id="P1">
    <rect x="43.0" y="36.5" width="26" height="127.0" rx="2" fill="#1c1c1c" stroke="#000000" stroke-width="1"/>
