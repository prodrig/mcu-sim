<?xml version="1.0" encoding="UTF-8"?>
<!--
  La placa de placas/esp32c3_y_f407.xml (fase E3): un ESP32-C3 y un
  STM32F407 que hablan por UART. No es una placa que exista; el dibujo, de
  placas/dibuja_esp.py, la pinta como un esquema: los dos chips (c3 y f4), el
  cristal del F407 (X1), las dos lineas de la UART y los dos puentes que
  escuchan (C3 y F4). Una unidad, 0,1 mm.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="62mm" height="33mm">
  <rect x="10.0" y="10.0" width="600.0" height="310.0" rx="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="3"/>
  <rect id="c3" x="70.0" y="70.0" width="160.0" height="160.0" rx="4" fill="#2b2b2b" stroke="#555555" stroke-width="1.5"/>
  <text x="150.0" y="144.0" font-family="sans-serif" font-size="16" fill="#d0d0d0" text-anchor="middle" font-weight="bold">ESP32-C3</text>
  <text x="150.0" y="166.0" font-family="sans-serif" font-size="14" fill="#bbbbbb" text-anchor="middle">c3</text>
  <rect id="f4" x="390.0" y="70.0" width="160.0" height="160.0" rx="4" fill="#2b2b2b" stroke="#555555" stroke-width="1.5"/>
  <text x="470.0" y="144.0" font-family="sans-serif" font-size="16" fill="#d0d0d0" text-anchor="middle" font-weight="bold">STM32F407</text>
  <text x="470.0" y="166.0" font-family="sans-serif" font-size="14" fill="#bbbbbb" text-anchor="middle">f4</text>
  <g id="X1">
  <rect x="440.0" y="255.0" width="60.0" height="26.0" rx="13" fill="#c9ccd1" stroke="#8e9399" stroke-width="1.5"/>
  </g>
  <text x="470.0" y="298.0" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">X1 8 MHz</text>
  <line x1="230" y1="120" x2="390" y2="120" stroke="#d4ac0d" stroke-width="4"/>
  <polygon points="390,120 378,113 378,127" fill="#d4ac0d"/>
  <text x="310.0" y="110.0" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">GPIO21 (U0TXD) -&gt; PA3</text>
  <line x1="230" y1="180" x2="390" y2="180" stroke="#d4ac0d" stroke-width="4"/>
  <polygon points="230,180 242,173 242,187" fill="#d4ac0d"/>
  <text x="310.0" y="170.0" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">PA2 -&gt; GPIO20 (U0RXD)</text>
  <rect id="C3" x="270.0" y="230.0" width="34.0" height="22.0" rx="3" fill="#2b2b2b" stroke="#555555" stroke-width="1"/>
  <text x="287.0" y="270.0" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">C3</text>
  <rect id="F4" x="316.0" y="230.0" width="34.0" height="22.0" rx="3" fill="#2b2b2b" stroke="#555555" stroke-width="1"/>
  <text x="333.0" y="270.0" font-family="sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">F4</text>
</svg>
