<?xml version="1.0" encoding="UTF-8"?>
<!--
  PLACA CON UN SERVO SG90, dibujada a mano: una aproximacion, no una foto. Es
  el dibujo de placas/servo_sg90.xml, que lo encuentra solo porque se llama
  como ella.

  Perfil de autor (mcu-sim-gui, doc/analisis-uso-ilustraciones.md §11): SVG
  1.2 Tiny, geometria como atributo, tamano en milimetros -una unidad es
  0,1 mm: la placa mide 42 x 47 mm, y a la izquierda asoman los pines
  acodados- y cada pieza con el id de su pieza en el XML: el conector P1, con
  cada pin por su nombre (P1.VCC, P1.GND, P1.PWM), y EL SERVO, visto desde
  arriba, que son dos cosas:

    SERVO.cuerpo@azul, SERVO.cuerpo@negro
          el cuerpo, con sus orejas de sujecion y la torre de la reductora.
          Son VARIANTES (common/svg_variantes.h): de las dos, mcu-sim deja la
          del `color` del servo y quita la otra antes de mandar el dibujo.
    SERVO el aspa, que GIRA con el angulo del servo (el efecto `angulo`):
          dibujada en el angulo 0, con la pala de la marca roja hacia
          arriba, y positivo es a la derecha. Dentro, una variante por cada
          `aspa` -SERVO.aspa@una, @dos, @cuatro, @seis, @disco-, y un circulo
          sin pintar centrado en el eje que alcanza mas que cualquiera de
          ellas: el centro de la caja del elemento es el eje, y gira sobre el.

  Junto a cada pin, un punto del color de su hilo en el cable del servo:
  rojo VCC, marron GND y naranja PWM.
-->
