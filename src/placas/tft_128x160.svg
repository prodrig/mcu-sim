  <circle cx="22" cy="328" r="10" fill="#4d0407"/>
  <circle cx="530" cy="22" r="16" fill="#e3c27a" stroke="#a8873f" stroke-width="2"/>
  <circle cx="530" cy="22" r="10" fill="#4d0407"/>
  <circle cx="530" cy="328" r="16" fill="#e3c27a" stroke="#a8873f" stroke-width="2"/>
  <circle cx="530" cy="328" r="10" fill="#4d0407"/>
  <rect x="456" y="105.0" width="16" height="140" fill="#c9852a" stroke="#8a5a17" stroke-width="1"/>
  <rect x="40" y="6" width="422" height="338" rx="4" fill="#15171a" stroke="#000000" stroke-width="1.5"/>
  <rect x="422" y="75" width="28" height="200" rx="2" fill="#24272c"/>
  <rect id="TFT" x="66" y="35" width="350" height="280" fill="#2a3036" stroke="#0b0c0e" stroke-width="1"/>
  <path d="M 76 43 L 176 43 L 106 155 L 76 155 Z" fill="#ffffff" fill-opacity="0.05"/>
  <g id="P1">
