<?xml version="1.0" encoding="UTF-8"?>
<!--
  PANTALLA TFT DE 1,8" (128x160, ST7735S), dibujada a mano: una aproximacion,
  no una foto. Es el dibujo de placas/tft_128x160.xml, que lo encuentra solo
  porque se llama como ella.

  Perfil de autor (mcu-sim-gui, doc/analisis-uso-ilustraciones.md §11): SVG
  1.2 Tiny, geometria como atributo, tamano en milimetros -una unidad es
  0,1 mm: la placa mide 56 x 35 mm, y a la derecha asoman los pines
  acodados- y cada pieza con el id de su pieza en el XML: el conector P1, con
  cada pin por su nombre (P1.VCC ... P1.LED) -cada uno, su cuadrado y su
  patilla acodada: un hilo engancha en la punta-; y la pantalla, TFT.

  TFT es la ZONA ACTIVA del vidrio, 35 x 28 mm: la ventana pinta encima lo que
  ensena la pantalla (el efecto `pantalla`). La imagen de un ST7735S es de 128
  de ancho y 160 de alto; en un elemento apaisado como este la ventana la pone
  girada un cuarto de vuelta a la izquierda: la fila 0 de la pantalla queda a
  la IZQUIERDA y la 159 junto al conector, por donde sale el cable plano del
  vidrio, y la columna 0 abajo. Para verla derecha en esta postura, el
  firmware pone MADCTL = 0x60 (MV y MX).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 596 350" width="59.6mm" height="35mm">
  <rect x="1" y="1" width="558" height="348" rx="8" fill="#c8161d" stroke="#7d0a0e" stroke-width="2"/>
  <circle cx="22" cy="22" r="16" fill="#e3c27a" stroke="#a8873f" stroke-width="2"/>
  <circle cx="22" cy="22" r="10" fill="#4d0407"/>
