  <text x="515.0" y="165.8" font-family="Arial" font-size="10" font-weight="bold" fill="#f5f5f5" text-anchor="end">RESET</text>
  <text x="515.0" y="191.2" font-family="Arial" font-size="10" font-weight="bold" fill="#f5f5f5" text-anchor="end">A/D</text>
  <text x="515.0" y="216.6" font-family="Arial" font-size="10" font-weight="bold" fill="#f5f5f5" text-anchor="end">SDA</text>
  <text x="515.0" y="242.0" font-family="Arial" font-size="10" font-weight="bold" fill="#f5f5f5" text-anchor="end">SCK</text>
  <text x="515.0" y="267.4" font-family="Arial" font-size="10" font-weight="bold" fill="#f5f5f5" text-anchor="end">LED</text>
</svg>
