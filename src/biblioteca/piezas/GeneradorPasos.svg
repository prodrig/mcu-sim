<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny" viewBox="0 0 334 162.4" width="33.40mm" height="16.24mm">
<!-- GeneradorPasos: el dibujo de la pieza para mcu-sim-build (doc/analisis_build.md, B5).
     Lo genera biblioteca/herramientas/dibuja_piezas.py: no se edita a mano.
     Unidades de 0.1 mm. La pieza es $, y cada terminal $.terminal. -->
<g id="$" transform="translate(20,20)" font-family="sans-serif">
  <rect x="0" y="0" width="294" height="122.4" rx="12" fill="#59626b" stroke="#0c2c4a" stroke-width="1.5"/>
  <circle cx="14" cy="14" r="6" fill="#e8e8e8" stroke="#888" stroke-width="1"/>
  <circle cx="280" cy="14" r="6" fill="#e8e8e8" stroke="#888" stroke-width="1"/>
  <circle cx="14" cy="108.4" r="6" fill="#e8e8e8" stroke="#888" stroke-width="1"/>
  <circle cx="280" cy="108.4" r="6" fill="#e8e8e8" stroke="#888" stroke-width="1"/>
  <text x="147" y="34" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">Generador de pasos</text>
  <rect x="121.6" y="87.7" width="50.8" height="25.4" rx="2" fill="#1a1a1a"/>
  <rect id="$.step" x="126.3" y="92.4" width="16" height="16" fill="#c9a227"/>
  <circle id="$.dir" cx="159.7" cy="100.4" r="8" fill="#c9a227" stroke="#7a5f0f" stroke-width="1.2"/>
  <circle cx="159.7" cy="100.4" r="3.2" fill="#3a2f0a"/>
  <text x="138.3" y="86.4" font-size="11" text-anchor="start" fill="#fff" transform="rotate(-90 138.3 86.4)">step</text>
  <text x="163.7" y="86.4" font-size="11" text-anchor="start" fill="#fff" transform="rotate(-90 163.7 86.4)">dir</text>
</g>
</svg>
