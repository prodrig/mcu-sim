<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny" viewBox="0 0 183.2 348.8" width="18.32mm" height="34.88mm">
<!-- Mosfet: el dibujo de la pieza para mcu-sim-build (doc/analisis_build.md, B5).
