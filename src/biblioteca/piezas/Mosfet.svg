  <circle cx="25.4" cy="90" r="3.2" fill="#3a2f0a"/>
  <text x="29.4" y="106" font-size="11" text-anchor="start" fill="#333" transform="rotate(90 29.4 106)">fuente</text>
  <rect x="64.2" y="-60" width="24" height="70" rx="4" fill="#222"/>
