  <text x="0" y="-38" font-size="13" text-anchor="middle" fill="#ddd">Mosfet</text>
  <path d="M-25.4 0L-25.4 90" fill="none" stroke="#b8b8b8" stroke-width="8" stroke-linecap="round"/>
  <circle id="$.puerta" cx="-25.4" cy="90" r="8" fill="#c9a227" stroke="#7a5f0f" stroke-width="1.2"/>
  <circle cx="-25.4" cy="90" r="3.2" fill="#3a2f0a"/>
  <text x="-21.4" y="106" font-size="11" text-anchor="start" fill="#333" transform="rotate(90 -21.4 106)">puerta</text>
