<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny" viewBox="0 0 140 215.3" width="14.00mm" height="21.53mm">
<!-- Ws2812: el dibujo de la pieza para mcu-sim-build (doc/analisis_build.md, B5).
     Lo genera biblioteca/herramientas/dibuja_piezas.py: no se edita a mano.
     Unidades de 0.1 mm. La pieza es $, y cada terminal $.terminal. -->
<g id="$" transform="translate(70,70)" font-family="sans-serif">
  <rect x="-50" y="-50" width="100" height="100" fill="#f6f6f6" stroke="#999" stroke-width="1.5"/>
  <circle cx="0" cy="0" r="36" fill="#fff" stroke="#bbb" stroke-width="2"/>
  <rect x="-10" y="-10" width="20" height="20" fill="#333"/>
  <path d="M0 50L0 100" fill="none" stroke="#666" stroke-width="4" stroke-linecap="round"/>
  <circle id="$.din" cx="0" cy="100" r="8" fill="#c9a227" stroke="#7a5f0f" stroke-width="1.2"/>
  <circle cx="0" cy="100" r="3.2" fill="#3a2f0a"/>
  <text x="0" y="122" font-size="11" text-anchor="middle" fill="#333">din</text>
</g>
</svg>
