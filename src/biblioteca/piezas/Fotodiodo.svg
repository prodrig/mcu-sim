<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny" viewBox="0 0 100 205.6" width="10.00mm" height="20.56mm">
<!-- Fotodiodo: el dibujo de la pieza para mcu-sim-build (doc/analisis_build.md, B5).
     Lo genera biblioteca/herramientas/dibuja_piezas.py: no se edita a mano.
     Unidades de 0.1 mm. La pieza es $, y cada terminal $.terminal. -->
<g id="$" transform="translate(50,50)" font-family="sans-serif">
  <circle cx="0" cy="0" r="30" fill="#222" stroke="#555" stroke-width="2"/>
  <rect x="-14" y="-14" width="28" height="28" fill="#555"/>
  <path d="M-12.7 20L-12.7 80" fill="none" stroke="#9a9a9a" stroke-width="5" stroke-linecap="round"/>
  <circle id="$.anodo" cx="-12.7" cy="80" r="8" fill="#c9a227" stroke="#7a5f0f" stroke-width="1.2"/>
  <circle cx="-12.7" cy="80" r="3.2" fill="#3a2f0a"/>
  <text x="-8.7" y="96" font-size="11" text-anchor="start" fill="#333" transform="rotate(90 -8.7 96)">anodo</text>
  <path d="M12.7 20L12.7 80" fill="none" stroke="#9a9a9a" stroke-width="5" stroke-linecap="round"/>
  <circle id="$.catodo" cx="12.7" cy="80" r="8" fill="#c9a227" stroke="#7a5f0f" stroke-width="1.2"/>
  <circle cx="12.7" cy="80" r="3.2" fill="#3a2f0a"/>
  <text x="16.7" y="96" font-size="11" text-anchor="start" fill="#333" transform="rotate(90 16.7 96)">catodo</text>
</g>
</svg>
