<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny" viewBox="0 0 150 220.3" width="15.00mm" height="22.03mm">
<!-- Button: el dibujo de la pieza para mcu-sim-build (doc/analisis_build.md, B5).
     Lo genera biblioteca/herramientas/dibuja_piezas.py: no se edita a mano.
     Unidades de 0.1 mm. La pieza es $, y cada terminal $.terminal. -->
<g id="$" transform="translate(75,75)" font-family="sans-serif">
  <rect x="-55" y="-55" width="110" height="110" rx="6" fill="#222"/>
  <circle cx="0" cy="0" r="32" fill="#444" stroke="#111" stroke-width="2"/>
  <circle cx="-45" cy="-45" r="6" fill="#888"/>
  <circle cx="45" cy="-45" r="6" fill="#888"/>
  <circle cx="-45" cy="45" r="6" fill="#888"/>
  <circle cx="45" cy="45" r="6" fill="#888"/>
  <path d="M0 50L0 100" fill="none" stroke="#666" stroke-width="4" stroke-linecap="round"/>
  <circle id="$.pin" cx="0" cy="100" r="8" fill="#c9a227" stroke="#7a5f0f" stroke-width="1.2"/>
  <circle cx="0" cy="100" r="3.2" fill="#3a2f0a"/>
  <text x="0" y="122" font-size="11" text-anchor="middle" fill="#333">pin</text>
</g>
</svg>
