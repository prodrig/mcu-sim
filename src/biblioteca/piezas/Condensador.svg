<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny" viewBox="0 0 140 219" width="14.00mm" height="21.90mm">
<!-- Condensador: el dibujo de la pieza para mcu-sim-build (doc/analisis_build.md, B5).
     Lo genera biblioteca/herramientas/dibuja_piezas.py: no se edita a mano.
     Unidades de 0.1 mm. La pieza es $, y cada terminal $.terminal. -->
<g id="$" transform="translate(70,70)" font-family="sans-serif">
  <circle cx="0" cy="0" r="50" fill="#1d3f8a" stroke="#0b1f4a" stroke-width="2"/>
  <path d="M-50 0A50 50 0 0 1 -35 -35L-20 -20A28 28 0 0 0 -28 0Z" fill="#cfd8e8"/>
  <text x="20" y="8" font-size="26" text-anchor="middle" fill="#fff">+</text>
  <path d="M-12.7 20L-12.7 80" fill="none" stroke="#9a9a9a" stroke-width="5" stroke-linecap="round"/>
  <circle id="$.mas" cx="-12.7" cy="80" r="8" fill="#c9a227" stroke="#7a5f0f" stroke-width="1.2"/>
  <circle cx="-12.7" cy="80" r="3.2" fill="#3a2f0a"/>
  <text x="-8.7" y="96" font-size="11" text-anchor="start" fill="#333" transform="rotate(90 -8.7 96)">mas</text>
  <path d="M12.7 20L12.7 80" fill="none" stroke="#9a9a9a" stroke-width="5" stroke-linecap="round"/>
  <circle id="$.menos" cx="12.7" cy="80" r="8" fill="#c9a227" stroke="#7a5f0f" stroke-width="1.2"/>
  <circle cx="12.7" cy="80" r="3.2" fill="#3a2f0a"/>
  <text x="16.7" y="96" font-size="11" text-anchor="start" fill="#333" transform="rotate(90 16.7 96)">menos</text>
