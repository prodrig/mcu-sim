<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny" viewBox="0 0 241.6 281.8" width="24.16mm" height="28.18mm">
<!-- arduino_uno_r3.alimentacion: Arduino UNO R3: alimentacion. Despiezado; unidades de 0.1 mm; cada pin es $.TIRA.N (doc/analisis_build.md, B6).
     Lo genera biblioteca/herramientas/genera_conectores.py: no se edita a mano. -->
<g id="$" transform="translate(20,50)" font-family="sans-serif">
  <text x="0" y="-16" font-size="12" font-weight="bold" fill="#000">Arduino UNO R3: alimentacion</text>
  <g transform="translate(8,26)">
    <rect id="$.ALIMENTACION.1" x="-8" y="-8" width="16" height="16" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="1"/>
    <text x="14" y="3" font-size="9" text-anchor="start" fill="#9a9996">1 NC</text>
    <rect id="$.ALIMENTACION.2" x="-8" y="17.4" width="16" height="16" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="1"/>
    <text x="14" y="28.4" font-size="9" text-anchor="start" fill="#c01c28">2 IOREF</text>
    <rect id="$.ALIMENTACION.3" x="-8" y="42.8" width="16" height="16" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="1"/>
    <text x="14" y="53.8" font-size="9" text-anchor="start" fill="#e66100">3 RESET</text>
    <rect id="$.ALIMENTACION.4" x="-8" y="68.2" width="16" height="16" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="1"/>
    <text x="14" y="79.2" font-size="9" text-anchor="start" fill="#c01c28">4 +3V3</text>
    <rect id="$.ALIMENTACION.5" x="-8" y="93.6" width="16" height="16" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="1"/>
    <text x="14" y="104.6" font-size="9" text-anchor="start" fill="#c01c28">5 +5V</text>
    <rect id="$.ALIMENTACION.6" x="-8" y="119" width="16" height="16" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="1"/>
    <text x="14" y="130" font-size="9" text-anchor="start" fill="#333333">6 GND</text>
    <rect id="$.ALIMENTACION.7" x="-8" y="144.4" width="16" height="16" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="1"/>
    <text x="14" y="155.4" font-size="9" text-anchor="start" fill="#333333">7 GND</text>
    <rect id="$.ALIMENTACION.8" x="-8" y="169.8" width="16" height="16" fill="#d4ac0d" stroke="#9a7d0a" stroke-width="1"/>
    <text x="14" y="180.8" font-size="9" text-anchor="start" fill="#c01c28">8 VIN</text>
    <text x="21.9" y="-14" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">ALIMENTACION</text>
  </g>
</g>
</svg>
