# openocd-esp32 contra el ESP32-C3 del simulador por su sonda CMSIS-DAP por TCP
# en JTAG (mcu-sim ... --cmsis-dap, puerto 4441). Hace falta un OpenOCD con
# `cmsis-dap backend tcp`: el de git posterior al 2025-09-01. La v0.12.0-esp32
# de Espressif no lo trae; con ella, mcu-sim_esp32c3.cfg (remote_bitbang).
adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host localhost
cmsis-dap tcp port 4441
transport select jtag
adapter speed 5000
source [find target/esp32c3.cfg]
