# OpenOCD de Espressif (openocd-esp32) contra el ESP32-C3 del simulador, por
# remote_bitbang en los pines del JTAG (MTMS, MTDI, MTCK, MTDO: GPIO4-7).
# target/esp32c3.cfg es el de openocd-esp32, SIN TOCAR.
#
#   ./build/mcu-sim placas/esp32c3_devkitm1.xml app/build/flash_args --openocd --tiempo-real
#   openocd -f ide/esp32c3/openocd/mcu-sim_esp32c3.cfg
#
# El C3 de fabrica tiene el JTAG en el USB-Serial-JTAG, no en los pines: la
# placa del simulador lleva jtag="pines" en su <mcu> (como quemar
# EFUSE_DIS_USB_JTAG), o se pide con --opcion jtag=pines.
adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 3335
transport select jtag
adapter speed 5000
source [find target/esp32c3.cfg]
