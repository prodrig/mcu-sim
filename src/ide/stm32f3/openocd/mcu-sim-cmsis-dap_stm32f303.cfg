# OpenOCD contra el STM32F303VC de mcu-sim por CMSIS-DAP sobre TCP
# (`mcu-sim placas/stm32f3discovery.xml --cmsis-dap`, en el puerto 4441): la
# rapida. Comprobado por C6 de verif/openocd/cmsis_dap.py (`make cmsis-dap`).
#
#   openocd -f mcu-sim-cmsis-dap_stm32f303.cfg
#
# Hace falta un OpenOCD con el backend `tcp` de cmsis-dap: uno de git
# posterior al 2025-09-01, o el de xPack desde la 0.12.0-7.

adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host localhost
cmsis-dap tcp port 4441
transport select swd
adapter speed 4000

source [find target/stm32f3x.cfg]
