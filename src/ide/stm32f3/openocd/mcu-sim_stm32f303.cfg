# OpenOCD contra el STM32F303VC de mcu-sim (fase S2 del F303): la sonda es el
# simulador (`mcu-sim placas/stm32f3discovery.xml --openocd`, remote_bitbang
# en el puerto 3335) y el objetivo, el .cfg de ST que trae OpenOCD, sin tocar.
# Su controlador stm32f1x copia su algoritmo a la SRAM y lo EJECUTA en el
# nucleo simulado, que programa el FPEC media palabra a media palabra.
#
#   openocd -f mcu-sim_stm32f303.cfg
#
# GDB se conecta despues a localhost:3333, el puerto por omision de OpenOCD.
# Hace falta un OpenOCD con SWD en remote_bitbang: uno de git posterior al
# 2024-04-07, o el de xPack desde la 0.12.0-4. La 0.12.0 publicada NO vale.
# Comprobado por O5 de verif/openocd/programa.py (`make openocd`).

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 3335
transport select swd

source [find target/stm32f3x.cfg]
