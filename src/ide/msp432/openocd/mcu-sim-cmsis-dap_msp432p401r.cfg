# OpenOCD contra el MSP432P401R de mcu-sim por CMSIS-DAP sobre TCP
# (`mcu-sim placa.xml --cmsis-dap`, en el puerto 4441): la sonda de la fase X2
# de doc/analisis_xds110.md, mucho mas rapida que remote_bitbang.
#
#   openocd -f mcu-sim-cmsis-dap_msp432p401r.cfg
#
# Hace falta un OpenOCD con el backend `tcp` de cmsis-dap: uno de git
# posterior al 2025-09-01, o el de xPack desde la 0.12.0-7.

adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host localhost
cmsis-dap tcp port 4441
transport select swd
adapter speed 4000

source [find target/ti/msp432.cfg]
