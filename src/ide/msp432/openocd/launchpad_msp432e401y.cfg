# OpenOCD contra una MSP-EXP432E401Y DE VERDAD, por su XDS110. (Para la
# P401R ya hay uno en OpenOCD: -f board/ti/msp432-launchpad.cfg, que en la
# 0.12.0 se llama board/ti_msp432_launchpad.cfg.)
#
#   openocd -f launchpad_msp432e401y.cfg
#
# El E4 es, para OpenOCD, un TM4C129 (target/ti/stellaris.cfg). OpenOCD
# avisa de "Unknown did0 class" -su controlador de Flash no conoce la clase
# del MSP432E4- y aun asi programa: el tamano lo saca de DID1.

source [find interface/xds110.cfg]
transport select swd
adapter speed 2500

set CHIPNAME msp432e401y
source [find target/ti/stellaris.cfg]
