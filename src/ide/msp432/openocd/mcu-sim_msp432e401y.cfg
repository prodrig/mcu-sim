# OpenOCD contra el MSP432E401Y de mcu-sim (`mcu-sim placa.xml --openocd`,
# remote_bitbang en el puerto 3335). El E4 es, para OpenOCD, un TM4C129:
# target/ti/stellaris.cfg y su controlador de Flash `stellaris`, que avisa
# de "Unknown did0 class" (no conoce la clase del MSP432E4) y programa igual.
#
#   openocd -f mcu-sim_msp432e401y.cfg

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 3335
transport select swd

set CHIPNAME msp432e401y
source [find target/ti/stellaris.cfg]

# El reset-start de stellaris.cfg baja la velocidad del adaptador con
# `adapter speed 500`, y remote_bitbang no tiene velocidad: el evento falla y
# el reset se queda a medias. El E4 es de la clase de los TM4C129
# (Snowflake), que se resetea con SYSRESETREQ: es lo unico que hace falta.
$_TARGETNAME configure -event reset-start {
	cortex_m reset_config sysresetreq
}
