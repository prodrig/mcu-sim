# OpenOCD contra el MSP432P401R de mcu-sim: la sonda es el simulador
# (`mcu-sim placa.xml --openocd`, remote_bitbang en el puerto 3335) y el
# objetivo, el .cfg de TI que trae OpenOCD, sin tocar.
#
#   openocd -f mcu-sim_msp432p401r.cfg
#
# GDB se conecta despues a localhost:3333, el puerto por omision de OpenOCD
# (no se fija aqui: Cortex-Debug elige el suyo). Hace falta un OpenOCD con
# SWD en remote_bitbang: uno de git posterior al 2024-04-07, o el de xPack
# desde la 0.12.0-4. La 0.12.0 publicada NO vale (doc/analisis_xds110.md §8).

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 3335
transport select swd

source [find target/ti/msp432.cfg]
