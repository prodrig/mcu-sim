# OpenOCD contra el MSP432E401Y de mcu-sim por CMSIS-DAP sobre TCP
# (`mcu-sim placa.xml --cmsis-dap`, en el puerto 4441). El E4 es, para
# OpenOCD, un TM4C129: target/ti/stellaris.cfg y su controlador de Flash
# `stellaris`, que avisa de "Unknown did0 class" y programa igual.
#
#   openocd -f mcu-sim-cmsis-dap_msp432e401y.cfg
#
# Hace falta un OpenOCD con el backend `tcp` de cmsis-dap: uno de git
# posterior al 2025-09-01, o el de xPack desde la 0.12.0-7.

adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host localhost
cmsis-dap tcp port 4441
transport select swd
adapter speed 4000

set CHIPNAME msp432e401y
source [find target/ti/stellaris.cfg]

# El reset-start de stellaris.cfg baja la velocidad a 500 kHz, que aqui vale,
# pero el E4 se resetea con SYSRESETREQ como un TM4C129: se dice igual que
# en el .cfg de remote_bitbang, para que los dos hagan lo mismo
$_TARGETNAME configure -event reset-start {
	cortex_m reset_config sysresetreq
}
